version: 2
models:
  - name: stg_sales
    description: Latest record for each order line with parsed source fields.
    columns:
      - name: sales_line_key
        tests: [not_null, unique]
      - name: order_date
        tests: [not_null]
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: ['Completed', 'Cancelled', 'Returned']
  - name: dim_customers
    columns:
      - name: customer_id
        tests: [not_null, unique]
  - name: dim_products
    columns:
      - name: product_id
        tests: [not_null, unique]
  - name: fct_sales
    columns:
      - name: sales_line_key
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
  - name: daily_sales
    columns:
      - name: order_date
        tests: [not_null, unique]
