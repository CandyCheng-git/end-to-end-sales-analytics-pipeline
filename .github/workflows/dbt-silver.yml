name: dbt Silver fixture validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dbt-silver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dbt and fixture dependencies
        run: |
          python -m pip install 'dbt-core==1.12.6' 'dbt-duckdb==1.11.1' 'duckdb>=1.3,<2' 'pandas>=2.2,<3'
      - name: Seed small synthetic Olist Bronze fixtures
        run: python scripts/ci_olist_fixtures.py seed
      - name: Build all Olist Silver models and data tests
        env:
          DBT_DUCKDB_PATH: data/ci/sales.duckdb
        run: dbt build --project-dir dbt --profiles-dir . --select "stg_olist_*" "int_olist_*"
      - name: Check Olist fixture grains and mapping outcomes
        run: python scripts/ci_olist_fixtures.py check
      - name: Rebuild synthetic sales regression
        run: |
          python scripts/ingest_sales.py
          dbt build --project-dir dbt --profiles-dir . --select stg_sales+
          python scripts/export_gold.py
          test -s data/processed/daily_sales.csv
