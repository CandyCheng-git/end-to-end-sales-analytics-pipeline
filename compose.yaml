services:
  pipeline:
    build: .
    working_dir: /app
    volumes:
      - ./data:/app/data
    command: >-
      bash -lc "python scripts/ingest_sales.py &&
      dbt build --project-dir dbt --profiles-dir . --select stg_sales+ &&
      python scripts/export_gold.py"

  olist-ingestion:
    build: .
    working_dir: /app
    volumes:
      - ./data:/app/data
    command: python scripts/ingest_olist.py
